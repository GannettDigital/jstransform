# This library should not use any private repositories so doesn't need Vault.
name: Lint
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/lint.yaml
      - .golangci.yaml
      - "**/go.mod"
      - "**/go.sum"
      - "**/*.go"
env:
  GOPRIVATE: github.com/GannettDigital
permissions:
  contents: read
  pull-requests: read  # For annotations and/or 'only-new-issues' option.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.version }}
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
          cache: false
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          GOMEMLIMIT: 15872MiB  # = 15.5GiB; see https://github.com/GannettDigital/cloud-engineering-gke/blob/master/helm-charts/arc-runner-scale-set/overrides_values/cara-owsley/cet-beefy.yaml#L35
        with:
          version: latest
          install-mode: goinstall  # To avoid error when go.mod's `toolchain` is newer than linter's binary used.
